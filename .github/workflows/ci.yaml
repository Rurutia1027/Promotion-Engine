name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  maven-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven compile
        run: mvn -B -ntp compile
